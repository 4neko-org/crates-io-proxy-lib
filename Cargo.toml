[package]
name = "crates-io-proxy-fork"
description = "Caching HTTP proxy server for the crates.io registry lib"
version = "0.2.4"
authors = ["Sergey Kvachonok <ravenexp@gmail.com>", "Aleksandr Morozov <alex@4neko.org>"]
edition = "2024"
homepage = "https://github.com/ravenexp/crates-io-proxy"
repository = "https://github.com/ravenexp/crates-io-proxy"
license = "MIT OR Apache-2.0"
keywords = ["crates", "cargo", "registry", "proxy", "cache"]
categories = ["development-tools", "caching", "web-programming::http-server"]
readme = "README.md"

[lib]
crate-type = ["rlib"]

[features]

default = []

async_client = []

[dependencies]
ureq = "3.4"
httpdate = "1.0"
url = "2.5"


[dev-dependencies]
tiny_http_fork = "0.12"
tempfile = "~3.27"
reqwest = { version = "0.13" }
rocket = "0.5"

[[example]]
name = "impl_example"

[[example]]
name = "impl_async_example"
required-features = ["async_client"]
