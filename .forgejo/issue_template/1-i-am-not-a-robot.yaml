name: "I am not a robot and I have a problem (not a security) I would like to report"
description: If you are not a robot, and you have some kind of a problem to report or you would like to complain, this is the best choice.
title: "problem: "
labels: ["problem", "impact/unknown"]
body:
- type: markdown
  attributes:
    value: |
      **NOTE: If your issue is related to security, please email <patch@4neko.org>. Don't report it here, especially if it has a large/immidiate impact!**
- type: markdown
  attributes:
    value: |
      - You are acknowledged that the LLM/AI/whatever generated code is not welcommed. The author/community is not "neoluddit" or whatever. This is just a code which is free from slop.
      - Please, write only in English language (if you cannot, use DeepL translator).
      - Violation of the policies or rules of this repository or Codeberg are penalized. 
      - Don't go into someone else's monastery with your own rules!
- type: dropdown
  id: can-reproduce
  attributes:
    label: Does your problem affects multiple architectures/OSes?
    description: |
      Your problem affects multiple targets/arches or it is something else.
    options:
    - "Yes, this is a fallout (affects more than one target/arch)"
    - "No or I did not test / I am not sure but I have a problem on specific OS"
    - "Unknown, there issue is about something else i.e new feature/problem which does not affect much"
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Problem description
    description: |
      Please describe your problem in a free form.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: About your building environment
    description: |
      Please provide a brief description of what Rust compiler, OS type/version you are building.
      ```bash
        rustc +nightly -V # rustc 1.101.0-nightly (7189d39d9 2026-10-22)
        rustc -V # rustc 1.99.1 (58cf8f9c3 2026-10-13)
        uname -a # Linux fedora 7.2.11-200.fc44.x86_64
      ```
      For example: rustc 1.99.1, Linux fedora 7.2.11-200.fc44.x86_64

      Make sure that if, for example, Windows supports is not declared, then please don't report any problems with it.
      </details>
  validations:
    required: true
- type: textarea
  id: workarounds
  attributes:
    label: Describe workaround if you have any.
    description: |
      If you solved problem or have an idea how to do it, please share it there.
- type: textarea
  id: versions
  attributes:
    label: Other details
    description: |
      Please include other details which are not a part of the problem, but could be usefull. (not mandatory)
  validations:
    required: false
- type: markdown
  attributes:
    value: |
      ### Solutions
      
      *Accepted solutions to address this problem will go here*
  visible: [content]
